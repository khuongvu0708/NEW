<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Website tin tức</title>
</head>

<body>

    <h1>WEBSITE TIN TỨC</h1>

    <h2>Thêm tin tức mới</h2>

    <form action="/add" method="POST">

        <input type="text" name="title" placeholder="Nhập tiêu đề" required>

        <br><br>

        <textarea name="content" placeholder="Nhập nội dung" required></textarea>

        <br><br>

        <button type="submit">Thêm tin</button>

    </form>

    <hr>

    <h2>Danh sách tin tức</h2>

    {% for article in news_list %}

    <h3>{{ article.title }}</h3>

    <a href="/detail/{{ article.id }}">
        Xem chi tiết
    </a>

    <form action="/delete/{{ article.id }}" method="POST" style="display:inline">

        <button type="submit">Xóa</button>

    </form>

    <hr>

    {% else %}

    <p>Chưa có tin tức nào.</p>

    {% endfor %}

</body>

</html>
